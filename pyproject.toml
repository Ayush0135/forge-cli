[project]
name = "forge-cli"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.120.2",
    "gitpython>=3.1.57",
    "google-genai>=2.16.0",
    "openai>=2.52.0",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
    "rich>=15.0.0",
    "tree-sitter>=0.26.0",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-typescript>=0.23.2",
    "typer>=0.27.1",
    "watchdog>=6.0.0",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.1",
]
[project.scripts]
forge = "forge_cli.main:app"

[tool.ruff.lint]
ignore = ["B008", "BLE001", "S110"]
